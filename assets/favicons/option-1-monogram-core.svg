<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b121e" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ff7b00" />
    </linearGradient>
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg-grad)" stroke="#1a2638" stroke-width="3" />
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="8 4" />

  <!-- Geometric "M" Engine Core Glyphs -->
  <!-- Left Wing -->
  <path d="M 28 94 L 28 34 L 46 54 L 46 94 Z" fill="url(#cyan-glow)" />
  <!-- Right Wing -->
  <path d="M 100 94 L 100 34 L 82 54 L 82 94 Z" fill="url(#cyan-glow)" />
  <!-- Center Apex Chevron -->
  <path d="M 46 54 L 64 34 L 82 54 L 64 74 Z" fill="#0c1828" stroke="url(#cyan-glow)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Radiant Reactor Center Node -->
  <circle cx="64" cy="54" r="5.5" fill="url(#amber-accent)" filter="url(#core-glow)" />
  <circle cx="64" cy="54" r="2.5" fill="#ffffff" />

  <!-- Corner Tech Accents -->
  <circle cx="28" cy="28" r="2.5" fill="#00f2fe" opacity="0.6" />
  <circle cx="100" cy="28" r="2.5" fill="#00f2fe" opacity="0.6" />
</svg>
