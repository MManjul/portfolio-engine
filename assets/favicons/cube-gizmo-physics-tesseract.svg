<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tess-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="100%" stop-color="#02050a" />
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="energy-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tess-bg)" stroke="#1c2b42" stroke-width="3" />

  <!-- Outer Isometric Physics AABB Collider Wireframe -->
  <polygon points="64,18 104,41 64,64 24,41" fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="4 3" />
  <line x1="24" y1="41" x2="24" y2="87" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="104" y1="41" x2="104" y2="87" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="64" y1="64" x2="64" y2="110" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="24,87 64,110 104,87" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Inner High-Density Rigid Body Cube (Solid Simulation Core) -->
  <polygon points="64,38 88,52 64,66 40,52" fill="url(#cube-top)" />
  <polygon points="40,52 64,66 64,94 40,80" fill="url(#cube-left)" />
  <polygon points="64,66 88,52 88,80 64,94" fill="url(#cube-right)" />

  <!-- White Edge Bevels for 3D Definition -->
  <line x1="64" y1="38" x2="64" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
  <line x1="40" y1="52" x2="64" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
  <line x1="88" y1="52" x2="64" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
  <line x1="64" y1="66" x2="64" y2="94" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Angular Momentum / Physics Velocity Vector (Amber Arc & Apex Arrow) -->
  <path d="M 32 36 A 48 48 0 0 1 96 36" fill="none" stroke="#ffb800" stroke-width="2.5" stroke-linecap="round" filter="url(#energy-glow)" />
  <polygon points="98,34 90,32 94,40" fill="#ffb800" />

  <!-- Center Mass Origin Node -->
  <circle cx="64" cy="66" r="4.5" fill="#ffb800" filter="url(#energy-glow)" />
  <circle cx="64" cy="66" r="2" fill="#ffffff" />
</svg>
