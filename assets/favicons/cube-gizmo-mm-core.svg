<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>
    <linearGradient id="cyan-axis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00a8ff" />
    </linearGradient>
    <linearGradient id="emerald-axis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f090" />
      <stop offset="100%" stop-color="#00a86b" />
    </linearGradient>
    <linearGradient id="amber-axis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>
    <filter id="core-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg-box)" stroke="#1a283c" stroke-width="3" />

  <!-- Isometric Coordinate Grid Lines (AABB Bounding Box) -->
  <polygon points="64,22 102,44 64,66 26,44" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3 3" />
  <polygon points="26,44 64,66 64,106 26,84" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <polygon points="64,66 102,44 102,84 64,106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Isometric "M" Monogram Formed by 3D Engine Geometry -->
  <!-- Left Column (Z-Axis Vertical Rail) -->
  <polygon points="32,46 44,53 44,95 32,88" fill="url(#cyan-axis)" opacity="0.9" />
  
  <!-- Right Column (Opposite Vertical Rail) -->
  <polygon points="84,53 96,46 96,88 84,95" fill="url(#cyan-axis)" opacity="0.9" />

  <!-- Central Incline Chevrons (Forming the 3D "M" V-Shape) -->
  <polygon points="44,53 64,66 64,80 44,67" fill="url(#emerald-axis)" opacity="0.95" />
  <polygon points="84,53 64,66 64,80 84,67" fill="url(#amber-axis)" opacity="0.95" />

  <!-- 3D Coordinate Axis Handles (X: Right/Amber, Y: Up/Cyan, Z: Left/Emerald) -->
  <!-- Up Vector (Z in UE5 / Y in Physics) -->
  <line x1="64" y1="66" x2="64" y2="24" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="64,17 60,26 68,26" fill="#00f2fe" />

  <!-- Right Vector (+X Red/Amber Axis) -->
  <line x1="64" y1="66" x2="102" y2="44" stroke="#ffb800" stroke-width="3" stroke-linecap="round" />
  <polygon points="107,41 99,41 103,49" fill="#ffb800" />

  <!-- Left Vector (+Y Green/Emerald Axis) -->
  <line x1="64" y1="66" x2="26" y2="44" stroke="#00f090" stroke-width="3" stroke-linecap="round" />
  <polygon points="21,41 25,49 29,41" fill="#00f090" />

  <!-- Radiant Central Coordinate Origin Vertex -->
  <circle cx="64" cy="66" r="6" fill="#ffffff" filter="url(#core-glow)" />
  <circle cx="64" cy="66" r="3" fill="#ffb800" />
</svg>
