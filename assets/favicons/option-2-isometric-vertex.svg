<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iso-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>
    <linearGradient id="top-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
    <linearGradient id="left-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072b2" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>
    <linearGradient id="right-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="vertex-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#iso-bg)" stroke="#162438" stroke-width="3" />

  <!-- Isometric Engine Coordinate Cube -->
  <!-- Top Face (X-Y Plane) -->
  <polygon points="64,24 96,42 64,60 32,42" fill="url(#top-face)" opacity="0.9" />
  
  <!-- Left Face (Y-Z Plane) -->
  <polygon points="32,42 64,60 64,98 32,80" fill="url(#left-face)" opacity="0.85" />
  
  <!-- Right Face (X-Z Plane) -->
  <polygon points="64,60 96,42 96,80 64,98" fill="url(#right-face)" opacity="0.95" />

  <!-- Wireframe Blueprint Grid Lines -->
  <line x1="64" y1="24" x2="64" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="32" y1="42" x2="64" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="96" y1="42" x2="64" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="64" y1="60" x2="64" y2="98" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />

  <!-- Core Apex Origin Gizmo (X, Y, Z Central Vertex) -->
  <circle cx="64" cy="60" r="7" fill="#ffb800" filter="url(#vertex-glow)" />
  <circle cx="64" cy="60" r="3.5" fill="#ffffff" />
</svg>
